<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axel Yahir Valencia Torres - Tarjeta de Presentación</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

  <main class="card-container">
    <article class="card">
      <!-- Fotografía circular limpia -->
      <div class="card-photo-wrapper">
        <img src="images/axel.svg" alt="Fotografía de Axel Yahir Valencia Torres" class="card-photo">
      </div>

      <!-- Nombre y puesto -->
      <header class="card-header">
        <h1 class="card-name">Axel Yahir Valencia Torres</h1>
        <span class="card-role">Historiador</span>
      </header>

      <!-- Datos básicos -->
      <div class="card-info-box">
        <div class="info-item">
          <svg class="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a11.042 11.042 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          <span><strong class="info-label">Número:</strong> +52 993 433 0167</span>
        </div>
      </div>

      <!-- Habilidades -->
      <section class="card-section">
        <h2 class="section-title">Habilidades</h2>
        <ul class="skills-list">
          <li>
            <svg class="check-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
            <span>Crear historias.</span>
          </li>
        </ul>
      </section>

      <div class="card-footer">Proyecto Escolar</div>
    </article>
  </main>

</body>
</html>
